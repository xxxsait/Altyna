<script>
  const video = document.getElementById('introVideo');
  const text = document.getElementById('text');
  const photos = document.getElementById('photos');
  const photoText = document.getElementById('photoText');
  const music = document.getElementById('backgroundMusic');

  // Запускаем видео после клика на страницу
  document.body.addEventListener('click', function startVideo() {
    video.muted = false;
    video.play();
    document.body.removeEventListener('click', startVideo);
  });

  // Когда видео закончилось
  video.addEventListener('ended', () => {
    video.style.display = 'none';
    text.style.display = 'block';

    setTimeout(() => {
      photos.style.display = 'block';

      // Запускаем музыку
      music.volume = 0.5;
      music.play().catch(() => console.log('Невозможно воспроизвести музыку без клика'));
    }, 2000);
  });

  // Показ текста при клике на фото
  photos.addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') {
      const textForPhoto = e.target.getAttribute('data-text');
      photoText.innerHTML = textForPhoto;
      photoText.style.display = 'block';
    }
  });
</script>
